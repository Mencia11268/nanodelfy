name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar
        # mappy no publica ruedas binarias: compilar solo para la
        # arquitectura nativa del ejecutor (evita universal2 en macOS)
        env:
          ARCHFLAGS: -arch ${{ runner.arch == 'ARM64' && 'arm64' || 'x86_64' }}
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest httpx
      - name: Tests
        run: pytest -v
